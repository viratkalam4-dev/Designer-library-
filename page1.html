<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Library | Login</title>
  <style>
    :root {
      --bg: #080b18;
      --card: rgba(17, 21, 48, 0.78);
      --text: #f8f9ff;
      --muted: #a6acd0;
      --primary: #8b5cf6;
      --secondary: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, .24), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(34, 211, 238, .18), transparent 30%),
        var(--bg);
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: .16;
      animation: drift 25s linear infinite;
    }
    .stars::before { background-size: 130px 130px; animation-duration: 40s; opacity: .1; }
    .stars::after { background-size: 210px 210px; animation-duration: 55s; opacity: .08; }

    .orb {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .32;
      background: linear-gradient(135deg, var(--primary), transparent 65%);
      animation: float 7s ease-in-out infinite;
    }
    .orb.one { top: -110px; left: 12%; }
    .orb.two { right: -100px; bottom: -100px; animation-delay: -3s; background: linear-gradient(135deg, var(--secondary), transparent 65%); }

    .login-shell {
      position: relative;
      z-index: 2;
      width: min(940px, calc(100% - 32px));
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 30px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 30px 90px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px;
      background: linear-gradient(145deg, rgba(139,92,246,.28), rgba(34,211,238,.06));
    }
    .hero::after {
      position: absolute;
      width: 280px;
      height: 280px;
      right: -110px;
      top: 100px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 35px rgba(255,255,255,.025), 0 0 0 70px rgba(255,255,255,.018);
      animation: pulse 4s ease-in-out infinite;
    }

    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: .5px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 8px 25px rgba(139,92,246,.4);
    }
    .hero-copy { position: relative; z-index: 1; }
    .hero h1 { max-width: 360px; margin: 0 0 18px; font-size: clamp(38px, 5vw, 62px); line-height: .98; letter-spacing: -3px; }
    .hero h1 span { color: #9beeff; }
    .hero p { max-width: 350px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .feature { display: flex; align-items: center; gap: 10px; color: #d9dcf3; font-size: 13px; }
    .feature i { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); box-shadow: 0 0 14px var(--secondary); }

    .form-panel { display: flex; flex-direction: column; justify-content: center; padding: 52px; background: rgba(5,8,24,.38); }
    .form-panel h2 { margin: 0 0 8px; font-size: 31px; letter-spacing: -1px; }
    .subtext { margin: 0 0 30px; color: var(--muted); font-size: 14px; }
    label { display: block; margin: 18px 0 8px; color: #dfe2f8; font-size: 13px; font-weight: 600; }
    .input-wrap { position: relative; }
    .input-wrap span { position: absolute; top: 50%; left: 15px; color: #8c91b6; transform: translateY(-50%); }
    input {
      width: 100%;
      padding: 15px 15px 15px 43px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;
      outline: none;
      color: var(--text);
      font: inherit;
      background: rgba(255,255,255,.065);
      transition: .25s ease;
    }
    input:focus { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(34,211,238,.1); }
    input::placeholder { color: #777d9e; }
    .options { display: flex; justify-content: space-between; align-items: center; margin: 17px 0 24px; color: var(--muted); font-size: 12px; }
    .remember { display: flex; align-items: center; gap: 7px; }
    .remember input { width: auto; accent-color: var(--primary); }
    a { color: #8be8f7; text-decoration: none; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(100deg, var(--primary), #667eea, var(--secondary));
      background-size: 220% auto;
      box-shadow: 0 10px 25px rgba(99,102,241,.3);
      transition: .25s ease;
    }
    button:hover { transform: translateY(-2px); background-position: right center; box-shadow: 0 14px 30px rgba(34,211,238,.22); }
    .signup { margin: 26px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
    .message { min-height: 20px; margin-top: 16px; color: #8ef7c5; text-align: center; font-size: 13px; }

    @keyframes appear { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes float { 50% { transform: translate(35px, 25px) scale(1.08); } }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: .55; } }
    @keyframes drift { to { transform: translate3d(90px, 90px, 0); } }
    @media (max-width: 700px) {
      body { overflow: auto; padding: 18px 0; }
      .login-shell { grid-template-columns: 1fr; min-height: auto; border-radius: 22px; }
      .hero { min-height: 320px; padding: 32px; }
      .hero h1 { font-size: 42px; }
      .form-panel { padding: 34px 28px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="orb one"></div><div class="orb two"></div>

  <main class="login-shell">
    <section class="hero">
      <div class="brand"><div class="brand-mark">✦</div> DESIGN LIBRARY</div>
      <div class="hero-copy">
        <h1>Welcome to your <span>next chapter.</span></h1>
        <p>Sign in to unlock a calmer, smarter way to organize your ideas and bring them to life.</p>
      </div>
      <div class="feature"><i></i> Secure, simple, and made for your momentum</div>
    </section>

    <section class="form-panel">
      <h2>Welcome back</h2>
      <p class="subtext">Enter your details to continue.</p>
      <form id="loginForm">
        <label for="email">Email address</label>
        <div class="input-wrap"><span>✉</span><input id="email" type="email" placeholder="you@example.com" required /></div>
        <label for="password">Password</label>
        <div class="input-wrap"><span>●</span><input id="password" type="password" placeholder="Enter your password" required /></div>
        <div class="options">
          <label class="remember"><input type="checkbox" /> Remember me</label>
          <a href="#" onclick="return false">Forgot password?</a>
        </div>
        <button type="submit">Sign in →</button>
        <div class="message" id="message"></div>
      </form>
      <p class="signup">New to Design Library? <a href="#" onclick="return false">Create an account</a></p>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const message = document.getElementById('message');
      const submitButton = loginForm.querySelector('button[type="submit"]');

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        message.textContent = 'You are signed in successfully ✨';
        submitButton.textContent = 'Opening your studio...';
        setTimeout(function () {
          window.location.href = 'gallery.html';
        }, 500);
      });
    });
  </script>
</body>
</html>
